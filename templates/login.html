<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear Soft IT Solutions - Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #06121f;
        }
        .bg-photo {
            position: absolute;
            inset: 0;
            background-image: url("{{ url_for('static', filename='img/login-bg-bricks.webp') }}");
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(6,18,31,0.55) 0%, rgba(11,31,51,0.40) 45%, rgba(18,52,86,0.55) 100%);
            z-index: 1;
        }
        .glow-orb {
            position: absolute;
            width: 420px; height: 420px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatOrb 14s ease-in-out infinite;
            z-index: 1;
        }
        .glow-orb.one { background: #ff8a3d; top: -100px; left: -80px; }
        .glow-orb.two { background: #2ec4b6; bottom: -120px; right: -60px; animation-delay: 4s; }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(30px,-24px) scale(1.08); }
        }
        .back-home {
            position: absolute;
            top: 24px; left: 28px;
            z-index: 3;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .back-home:hover { color: #fff; }
        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 16px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.45);
            overflow: hidden;
            animation: cardIn 0.5s ease-out;
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-header {
            background: linear-gradient(135deg, rgba(11,31,51,0.55), rgba(18,52,86,0.45));
            padding: 32px 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .login-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 80% 0%, rgba(255,138,61,0.25), transparent 55%);
        }
        .login-header > * { position: relative; z-index: 1; }
        .login-header img {
            height: 60px;
            width: auto;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .login-header h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }
        .login-header p {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin: 4px 0 0;
        }
        .login-body {
            padding: 32px 30px;
            background: transparent;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }
        .input-group-text {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            color: #fff;
        }
        .form-control {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,255,255,0.3);
            color: #fff;
            font-size: 14px;
            padding: 10px 14px;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.55); }
        .form-control:focus {
            background: rgba(255,255,255,0.16);
            border-color: #ff8a3d;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(255,138,61,0.18);
        }
        .btn-outline-secondary {
            background: rgba(255,255,255,0.10);
            border-color: rgba(255,255,255,0.3);
            color: #fff;
        }
        .btn-outline-secondary:hover,
        .btn-outline-secondary:focus,
        .btn-outline-secondary:active {
            background: rgba(255,255,255,0.2) !important;
            border-color: rgba(255,255,255,0.3) !important;
            color: #fff !important;
        }
        .btn-login {
            background: linear-gradient(135deg, #ff8a3d, #ff6b1a);
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 8px;
            box-shadow: 0 10px 26px rgba(255,138,61,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(255,138,61,0.45); color:#fff; }
        .alert-danger {
            font-size: 13px;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .login-footer {
            text-align: center;
            padding: 0 30px 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
        }
        .bms-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46,196,182,0.10);
            border: 1px solid rgba(46,196,182,0.35);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            color: #1b9d92;
            font-weight: 700;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-overlay"></div>
<div class="glow-orb one"></div>
<div class="glow-orb two"></div>
<a href="{{ url_for('index') }}" class="back-home"><i class="bi bi-arrow-left"></i> Back to home</a>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='img/dearsoft_logo.png') }}" alt="Dear Soft IT Solutions">
            <h2>Bricks Suppliers</h2>
            <p>Sign in to your account</p>
        </div>
        <div class="login-body">
            <div class="text-center">
                <span class="bms-badge"><i class="bi bi-bricks"></i> RM Portal</span>
            </div>
            {% if error %}
            <div class="alert alert-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" name="username"
                               placeholder="Enter username" value="{{ username or '' }}" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" name="password"
                               placeholder="Enter password" required>
                        <button class="btn btn-outline-secondary" type="button"
                                onclick="togglePwd(this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>
        <div class="login-footer">
            &copy; 2026 Dear Soft IT Solutions &nbsp;|&nbsp; RM v1.0
        </div>
    </div>
</div>
<script>
function togglePwd(btn) {
    const inp = btn.previousElementSibling;
    if (inp.type === 'password') {
        inp.type = 'text';
        btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
    } else {
        inp.type = 'password';
        btn.innerHTML = '<i class="bi bi-eye"></i>';
    }
}
</script>
</body>
</html>
